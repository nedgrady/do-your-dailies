openapi: 3.0.3
info:
  title: Do Your Dailies API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                type: string
  /api/chores:
    get:
      operationId: listChores
      responses:
        "200":
          description: List chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chore"
    post:
      operationId: createChore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreRequest"
      responses:
        "201":
          description: Created chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "422":
          description: Invalid JSON payload
  /api/chores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
    get:
      operationId: getChore
      responses:
        "200":
          description: A chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "404":
          description: Chore not found
    put:
      operationId: updateChore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChoreRequest"
      responses:
        "200":
          description: Updated chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "404":
          description: Chore not found
        "422":
          description: Invalid JSON payload
    delete:
      operationId: deleteChore
      responses:
        "204":
          description: Deleted chore
        "404":
          description: Chore not found
  /api/chore-completions:
    get:
      operationId: listChoreCompletions
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List chore completions created between start and end
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChoreCompletion"
        "400":
          description: Missing or invalid start/end query parameters
    post:
      operationId: createChoreCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreCompletionRequest"
      responses:
        "201":
          description: Created chore completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoreCompletion"
        "404":
          description: Chore not found
        "422":
          description: Invalid JSON payload
  /api/chore-queue:
    get:
      operationId: listChoreQueue
      parameters:
        - name: maxChores
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Ordered chores due for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChoreInQueue"
        "400":
          description: Invalid query parameter
components:
  schemas:
    Chore:
      type: object
      required:
        - id
        - name
        - cadenceInDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChoreInQueue:
      type: object
      required:
        - choreId
        - choreName
        - cadenceInDays
        - priority
      properties:
        choreId:
          type: integer
          format: uint64
        choreName:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        priority:
          type: number
        latestCompletionId:
          type: integer
          format: uint64
        lastCompletedAt:
          type: string
          format: date-time
    CreateChoreRequest:
      type: object
      required:
        - name
        - cadenceInDays
      properties:
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
    UpdateChoreRequest:
      type: object
      properties:
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
    ChoreCompletion:
      type: object
      required:
        - id
        - choreId
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        choreId:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateChoreCompletionRequest:
      type: object
      required:
        - choreId
      properties:
        choreId:
          type: integer
          format: uint64
