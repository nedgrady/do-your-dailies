openapi: 3.0.3
info:
  title: Do Your Dailies API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            text/plain:
              schema:
                type: string
  /api/chore-completors:
    get:
      operationId: listChoreCompletors
      responses:
        "200":
          description: List chore completors on this account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChoreCompletor"
    post:
      operationId: createChoreCompletor
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreCompletorRequest"
      responses:
        "201":
          description: Created chore completor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoreCompletor"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Invalid JSON payload or blank name
  /api/chores:
    get:
      operationId: listChores
      responses:
        "200":
          description: List chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chore"
    post:
      operationId: createChore
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreRequest"
      responses:
        "201":
          description: Created chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Invalid JSON payload
  /api/chores/bulk:
    post:
      operationId: bulkCreateChores
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateChoresRequest"
      responses:
        "201":
          description: Created chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chore"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: One or more rows failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateChoresValidationError"
  /api/chores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
    get:
      operationId: getChore
      responses:
        "200":
          description: A chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "404":
          description: Chore not found
    put:
      operationId: updateChore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChoreRequest"
      responses:
        "200":
          description: Updated chore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chore"
        "404":
          description: Chore not found
        "422":
          description: Invalid JSON payload
    delete:
      operationId: deleteChore
      responses:
        "204":
          description: Deleted chore
        "404":
          description: Chore not found
  /api/chore-insights:
    get:
      operationId: getChoreInsights
      responses:
        "200":
          description: Chore capacity and utilization insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoreInsights"
  /api/chore-completions:
    get:
      operationId: listChoreCompletions
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List chore completions created between start and end
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChoreCompletion"
        "400":
          description: Missing or invalid start/end query parameters
    post:
      operationId: createChoreCompletion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoreCompletionRequest"
      responses:
        "201":
          description: Created chore completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoreCompletion"
        "404":
          description: Chore not found
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Invalid JSON payload, empty choreCompletorIds, or a choreCompletorId that does not belong to this account
  /api/chore-completions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: uint64
    delete:
      operationId: deleteChoreCompletion
      responses:
        "204":
          description: Chore completion undone (soft deleted)
        "404":
          description: Chore completion not found
  /api/chore-queue:
    get:
      operationId: listChoreQueue
      responses:
        "200":
          description: Ordered chores due for the requested day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChoreInQueue"
  /api/chore-preview:
    get:
      operationId: getChorePreview
      parameters:
        - name: days
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: Simulated day-by-day chore schedule for the next `days` days, assuming every day's recommended chores are completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChorePreview"
        "400":
          description: Missing or invalid days query parameter
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key, unique per user action. Repeating a request with the same key replays the original response instead of creating another record. Reusing a key with a different request body returns 422.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Conflict:
      description: A request with this Idempotency-Key is still in progress. Retry after the Retry-After delay.
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    DisplayUnit:
      type: string
      enum: [DAY, WEEK, MONTH, YEAR]
    Emoji:
      type: string
      maxLength: 32
      description: A single emoji. Empty string means no emoji is set.
    Chore:
      type: object
      required:
        - id
        - name
        - cadenceInDays
        - displayUnit
        - emoji
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        displayUnit:
          $ref: "#/components/schemas/DisplayUnit"
        emoji:
          $ref: "#/components/schemas/Emoji"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChoreInQueue:
      type: object
      required:
        - choreId
        - choreName
        - cadenceInDays
        - priority
        - dueAt
        - emoji
      properties:
        choreId:
          type: integer
          format: uint64
        choreName:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        priority:
          type: number
        latestCompletionId:
          type: integer
          format: uint64
        lastCompletedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          description: When this chore becomes overdue (priority reaches 1).
        emoji:
          $ref: "#/components/schemas/Emoji"
    CreateChoreRequest:
      type: object
      required:
        - name
        - cadenceInDays
      properties:
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        displayUnit:
          $ref: "#/components/schemas/DisplayUnit"
        emoji:
          $ref: "#/components/schemas/Emoji"
        lastCompletedAt:
          type: string
          format: date-time
          description: >-
            When this chore was last actually done, if known. Backdates a
            completion record instead of leaving the chore with no history
            (which otherwise reads as "just done now").
    BulkCreateChoresRequest:
      type: object
      required:
        - chores
      properties:
        chores:
          type: array
          items:
            $ref: "#/components/schemas/CreateChoreRequest"
    BulkCreateChoresRowError:
      type: object
      required:
        - index
        - message
      properties:
        index:
          type: integer
        message:
          type: string
    BulkCreateChoresValidationError:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/BulkCreateChoresRowError"
    UpdateChoreRequest:
      type: object
      description: Omitted fields are left unchanged. An empty emoji clears it.
      properties:
        name:
          type: string
        cadenceInDays:
          type: integer
          minimum: 1
        displayUnit:
          $ref: "#/components/schemas/DisplayUnit"
        emoji:
          $ref: "#/components/schemas/Emoji"
    ChoreCompletor:
      type: object
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateChoreCompletorRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    ChoreCompletion:
      type: object
      required:
        - id
        - choreId
        - choreCompletorIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: uint64
        choreId:
          type: integer
          format: uint64
        choreCompletorIds:
          description: Who did this completion. Empty for backdated or imported completions.
          type: array
          items:
            type: integer
            format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateChoreCompletionRequest:
      type: object
      required:
        - choreId
        - choreCompletorIds
      properties:
        choreId:
          type: integer
          format: uint64
        choreCompletorIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: uint64
    ChoreProjection:
      type: object
      required:
        - chore
        - projectedCadence
      properties:
        chore:
          $ref: "#/components/schemas/Chore"
        projectedCadence:
          type: number
          format: double
    ChoreInsights:
      type: object
      required:
        - userDesiredCapacity
        - utilizationRatio
        - minCapacityToKeepUtilizationRatioGreaterThanOne
        - choreProjections
      properties:
        userDesiredCapacity:
          type: integer
        utilizationRatio:
          type: number
          format: double
        minCapacityToKeepUtilizationRatioGreaterThanOne:
          type: number
          format: double
        choreProjections:
          type: array
          items:
            $ref: "#/components/schemas/ChoreProjection"
    ChorePreviewChore:
      type: object
      required:
        - choreId
        - choreName
      properties:
        choreId:
          type: integer
          format: uint64
        choreName:
          type: string
    ChorePreviewDay:
      type: object
      required:
        - dayOffset
        - chores
      properties:
        dayOffset:
          type: integer
          minimum: 1
        chores:
          type: array
          items:
            $ref: "#/components/schemas/ChorePreviewChore"
    ChorePreview:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/ChorePreviewDay"
