package: contracts
generate:
  models: true
  chi-server: true
  strict-server: true
output: ../contracts/openapi_types.gen.go
output-options:
  skip-prune: true
  type-mapping:
    string:
      formats:
        date-time:
          type: utctime.Time
          import: do-your-dailies/server/internal/utctime
